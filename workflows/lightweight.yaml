# =============================================================================
# 轻量级科研工作流配置
# =============================================================================
# 适用场景：快速文献调研、短论文撰写、初步研究探索
# 特点：流程简洁、快速迭代、低资源消耗
# =============================================================================

workflow:
  name: lightweight
  version: "1.0.0"
  description: 轻量级科研工作流，适用于快速研究和短论文撰写
  mode: lightweight

# 阶段定义
# 每个阶段包含：名称、Skill模块、输入映射、输出定义、依赖关系
stages:
  # ---------------------------------------------------------------------------
  # 阶段 1: 学术搜索
  # ---------------------------------------------------------------------------
  - name: academic_search
    skill_module: skills.academic_search.skill.AcademicSearchSkill
    description: 基于研究主题进行学术文献检索，收集相关论文和资料
    inputs:
      # 来自用户输入或项目初始化
      research_topic:
        source: user_input
        type: string
        required: true
        description: 研究主题或关键词
      search_scope:
        source: user_input
        type: string
        required: false
        default: "comprehensive"
        description: 搜索范围（comprehensive/quick/targeted）
    outputs:
      - name: search_results
        type: list[dict]
        description: 检索到的文献列表，包含标题、作者、摘要、来源等
      - name: search_metadata
        type: dict
        description: 搜索元数据（总数、数据库来源、时间戳等）
    required: true
    optional: false
    timeout: 300  # 秒

  # ---------------------------------------------------------------------------
  # 阶段 2: 统计分析
  # ---------------------------------------------------------------------------
  - name: statistics
    skill_module: skills.statistics.skill.StatisticsSkill
    description: 对收集到的数据进行统计分析和质量评估
    inputs:
      # 来自上一阶段的输出
      search_results:
        source: academic_search.outputs.search_results
        type: list[dict]
        required: true
        description: 学术搜索得到的文献数据
      analysis_config:
        source: user_input
        type: dict
        required: false
        default: {}
        description: 统计分析配置参数
    outputs:
      - name: statistical_summary
        type: dict
        description: 统计摘要（文献分布、趋势分析、关键指标等）
      - name: data_quality_report
        type: dict
        description: 数据质量评估报告
    required: true
    optional: false
    timeout: 600

  # ---------------------------------------------------------------------------
  # 阶段 3: 可视化
  # ---------------------------------------------------------------------------
  - name: visualization
    skill_module: skills.visualization.skill.VisualizationSkill
    description: 生成数据可视化图表，辅助结果展示
    inputs:
      statistical_summary:
        source: statistics.outputs.statistical_summary
        type: dict
        required: true
        description: 统计分析结果
      visualization_config:
        source: user_input
        type: dict
        required: false
        default:
          chart_types: ["bar", "line", "pie"]
          style: "academic"
        description: 可视化配置（图表类型、样式等）
    outputs:
      - name: charts
        type: list[dict]
        description: 生成的图表列表（路径、类型、标题等）
      - name: visualization_report
        type: dict
        description: 可视化报告摘要
    required: true
    optional: false
    timeout: 300

  # ---------------------------------------------------------------------------
  # 阶段 4: 论文撰写
  # ---------------------------------------------------------------------------
  - name: writing
    skill_module: skills.writing.skill.WritingSkill
    description: 基于前期研究结果撰写论文初稿
    inputs:
      research_topic:
        source: user_input
        type: string
        required: true
      search_results:
        source: academic_search.outputs.search_results
        type: list[dict]
        required: true
      statistical_summary:
        source: statistics.outputs.statistical_summary
        type: dict
        required: true
      charts:
        source: visualization.outputs.charts
        type: list[dict]
        required: false
      writing_style:
        source: user_input
        type: string
        required: false
        default: "academic"
        description: 写作风格（academic/technical/popular）
    outputs:
      - name: draft_paper
        type: string
        description: 论文初稿（Markdown 格式）
      - name: paper_structure
        type: dict
        description: 论文结构大纲
      - name: citations
        type: list[dict]
        description: 引用文献列表
    required: true
    optional: false
    timeout: 1800

  # ---------------------------------------------------------------------------
  # 阶段 5: 润色优化
  # ---------------------------------------------------------------------------
  - name: polishing
    skill_module: skills.polishing.skill.PolishingSkill
    description: 对论文进行语言润色、格式优化和逻辑梳理
    inputs:
      draft_paper:
        source: writing.outputs.draft_paper
        type: string
        required: true
      paper_structure:
        source: writing.outputs.paper_structure
        type: dict
        required: false
      target_journal:
        source: user_input
        type: string
        required: false
        description: 目标期刊（用于格式适配）
    outputs:
      - name: polished_paper
        type: string
        description: 润色后的论文
      - name: revision_notes
        type: list[string]
        description: 修改说明和建议
    required: true
    optional: false
    timeout: 600

  # ---------------------------------------------------------------------------
  # 阶段 6: 审稿评估
  # ---------------------------------------------------------------------------
  - name: reviewer
    skill_module: skills.reviewer.skill.ReviewerSkill
    description: 模拟同行评审，评估论文质量和提出改进建议
    inputs:
      polished_paper:
        source: polishing.outputs.polished_paper
        type: string
        required: true
      citations:
        source: writing.outputs.citations
        type: list[dict]
        required: false
      review_criteria:
        source: user_input
        type: list[string]
        required: false
        default: ["novelty", "methodology", "clarity", "significance"]
        description: 评审标准
    outputs:
      - name: review_report
        type: dict
        description: 审稿报告（评分、意见、建议）
      - name: revision_suggestions
        type: list[dict]
        description: 具体修改建议
      - name: quality_score
        type: float
        description: 综合质量评分（0-10）
    required: true
    optional: false
    timeout: 600

  # ---------------------------------------------------------------------------
  # 阶段 7: PPT 生成
  # ---------------------------------------------------------------------------
  - name: paper2ppt
    skill_module: skills.paper2ppt.skill.Paper2PPTSkill
    description: 将论文内容转换为演示文稿
    inputs:
      polished_paper:
        source: polishing.outputs.polished_paper
        type: string
        required: true
      charts:
        source: visualization.outputs.charts
        type: list[dict]
        required: false
      presentation_config:
        source: user_input
        type: dict
        required: false
        default:
          slide_count: 15
          style: "academic"
        description: PPT 配置
    outputs:
      - name: presentation
        type: string
        description: PPT 文件路径
      - name: slide_outline
        type: list[dict]
        description: 幻灯片大纲
    required: true
    optional: false
    timeout: 600

# 全局配置
config:
  # 产出物版本管理
  artifact_versioning: true
  max_versions_per_artifact: 5

  # 错误处理
  on_stage_failure: "stop"  # stop | continue | retry
  max_retries: 2

  # 日志级别
  log_level: "INFO"

  # 输出目录结构
  output_structure:
    artifacts: "artifacts/{stage_name}/"
    checkpoints: "checkpoints/"
    exports: "exports/"
