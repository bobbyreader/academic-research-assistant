# 全局设置
#
# 本文件只保留**当前有代码读取**的配置项。未被任何代码路径读取的键会在这里
# 误导用户（宣称可配置，实则无效），因此已删除；计划中的键移至 ROADMAP.md
# 的“计划中的配置项”一节，待实现后再移回此处。

# API 配置（请替换为实际密钥）
api_keys:
  pubmed_email: ""  # 用于 PubMed API
  semantic_scholar_key: ""  # Semantic Scholar API
  crossref_email: ""  # CrossRef 礼貌池

# LLM 配置。密钥优先从环境变量读取，不要提交到仓库。
llm:
  provider: "codex_cli"  # codex_cli、gemini 或 openai_compatible
  model: ""  # 留空则使用本机 Codex CLI 的默认模型
  base_url: ""  # 留空则使用对应 provider 的默认地址
  timeout_seconds: 120  # 单次 LLM 请求超时（秒）

# 图表设置
figures:
  default_dpi: 300  # 出版级图表分辨率

# 审稿设置
review:
  reviewer_count: 1  # 模拟审稿人数量（0 = 关闭评审阶段）；每增加一位多一次 LLM 调用
