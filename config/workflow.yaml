# 科研工作流配置
# 定义三种工作流模式的阶段顺序、依赖关系和输入输出映射

workflows:

  # 轻量级工作流：适合已有数据、快速撰写 Nature 风格论文
  lightweight:
    description: "轻量级工作流：nature-skills 系列快速通道"
    stages:
      - name: academic_search
        skill: academic_search
        inputs: [research_topic]
        outputs: [literature_pool, citation_files]
        required: true

      - name: statistics
        skill: statistics
        inputs: [experiment_data, statistical_text]
        outputs: [statistical_report, revised_text]
        required: true

      - name: visualization
        skill: visualization
        inputs: [statistical_results, figure_specs]
        outputs: [publication_figures, export_plans]
        required: true

      - name: writing
        skill: writing
        inputs: [claims, figures, literature_pool]
        outputs: [manuscript_draft, submission_package]
        required: true

      - name: polishing
        skill: polishing
        inputs: [manuscript_draft]
        outputs: [polished_manuscript]
        required: true

      - name: reviewer
        skill: reviewer
        inputs: [polished_manuscript]
        outputs: [review_reports, synthesis]
        required: true

      - name: paper2ppt
        skill: paper2ppt
        inputs: [final_manuscript]
        outputs: [presentation_pptx]
        required: false

  # 重量级工作流：以 ARS 为核心，从零开始完整研究项目
  heavyweight:
    description: "重量级工作流：ARS 全流程调度"
    stages:
      - name: brainstorming
        skill: brainstorming
        inputs: [research_interest]
        outputs: [research_direction, hypotheses, key_questions]
        required: true

      - name: ars_deep_research
        skill: ars_integration
        component: deep_research
        inputs: [research_direction, key_questions]
        outputs: [research_brief, methodology_blueprint]
        required: true

      - name: ars_academic_paper
        skill: ars_integration
        component: academic_paper
        inputs: [research_brief, methodology_blueprint]
        outputs: [manuscript_draft, outline]
        required: true

      - name: ars_integrity_pre
        skill: ars_integration
        component: pipeline
        stage: stage_2_5_integrity_pre
        inputs: [manuscript_draft]
        outputs: [integrity_report_pre]
        required: true
        mandatory: true  # 不可跳过

      - name: ars_reviewer
        skill: ars_integration
        component: reviewer
        inputs: [manuscript_draft]
        outputs: [review_reports, decision]
        required: true

      - name: ars_revision
        skill: ars_integration
        component: academic_paper
        mode: revision
        inputs: [manuscript_draft, review_reports]
        outputs: [revised_manuscript, response_to_reviewers]
        required: true

      - name: ars_integrity_final
        skill: ars_integration
        component: pipeline
        stage: stage_4_5_integrity_final
        inputs: [revised_manuscript]
        outputs: [integrity_report_final]
        required: true
        mandatory: true  # 不可跳过

      - name: paper2ppt
        skill: paper2ppt
        inputs: [final_manuscript]
        outputs: [presentation_pptx]
        required: false

  # 混合型工作流：取各 Skill 优势组合（推荐）
  hybrid:
    description: "混合型工作流：各 Skill 优势组合，最大化效率"
    stages:
      - name: brainstorming
        skill: brainstorming
        inputs: [research_interest]
        outputs: [research_direction, hypotheses, key_questions]
        required: true

      - name: academic_search
        skill: academic_search
        inputs: [research_direction, key_questions]
        outputs: [literature_pool, citation_files, citation_audit]
        required: true

      - name: literature_review
        skill: literature_review
        inputs: [literature_pool, research_direction]
        outputs: [systematic_review, prisma_flow, gap_analysis]
        required: true

      - name: ars_deep_research
        skill: ars_integration
        component: deep_research
        mode: three_way_scan
        inputs: [systematic_review, gap_analysis]
        outputs: [research_brief, methodology_blueprint]
        required: true

      - name: statistics
        skill: statistics
        inputs: [experiment_data, methodology_blueprint]
        outputs: [statistical_report, revised_methods]
        required: true

      - name: visualization
        skill: visualization
        inputs: [statistical_results, figure_specs]
        outputs: [publication_figures, export_plans]
        required: true

      - name: ars_academic_paper
        skill: ars_integration
        component: academic_paper
        mode: full
        inputs: [research_brief, statistical_report, publication_figures, systematic_review]
        outputs: [manuscript_draft, outline, submission_package]
        required: true

      - name: polishing
        skill: polishing
        inputs: [manuscript_draft]
        outputs: [polished_manuscript, ai_flavor_report]
        required: true

      - name: reviewer
        skill: reviewer
        inputs: [polished_manuscript]
        outputs: [review_reports, synthesis, checklist_coverage]
        required: true

      - name: ars_integrity_final
        skill: ars_integration
        component: pipeline
        stage: stage_4_5_integrity_final
        inputs: [polished_manuscript, review_reports]
        outputs: [integrity_report_final]
        required: true
        mandatory: true  # 不可跳过

      - name: paper2ppt
        skill: paper2ppt
        inputs: [final_manuscript]
        outputs: [presentation_pptx, speaker_notes]
        required: false

# 数据映射规则：定义 Skill 间数据如何传递
data_mappings:
  brainstorming_to_search:
    research_direction -> query
    key_questions -> search_concepts

  search_to_review:
    literature_pool -> papers
    citation_files -> reference_manager

  review_to_ars:
    systematic_review -> background
    gap_analysis -> research_question

  statistics_to_visualization:
    statistical_report -> data_for_figures
    revised_methods -> figure_legend_text

  visualization_to_writing:
    publication_figures -> figure_files
    export_plans -> figure_captions

  writing_to_polishing:
    manuscript_draft -> text
    submission_package -> supporting_docs

  polishing_to_reviewer:
    polished_manuscript -> manuscript_text
    ai_flavor_report -> style_issues

  reviewer_to_revision:
    review_reports -> comments
    synthesis -> priority_actions

# 状态标记说明
status_definitions:
  ready: "产出可直接使用"
  ready_with_author_checks: "产出可用，但需作者确认特定项"
  blocked: "产出不可用，需解决阻塞问题"
